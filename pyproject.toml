[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "6g-agent-subnet-sim"
version = "0.1.0"
description = "Cross-layer heterogeneous-agent task subnet simulator and netns testbed"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.8", "numpy>=1.23", "Pillow>=10.0"]
viz = ["Flask>=2.2"]
all = [
  "Flask>=2.2",
  "matplotlib>=3.8",
  "numpy>=1.23",
  "Pillow>=10.0",
  "rich>=13",
]
dev = ["pytest>=8.0"]
demo = [
  "PySide6>=6.5",
  "pyqtgraph>=0.13",
  "rich>=13",
  "matplotlib>=3.8",
  "numpy>=1.23",
  "Pillow>=10.0",
]

[project.scripts]
tcanet-demo = "src.tcanet.prototype.launcher:main"
tcanetctl = "src.tcanet.prototype.ctl:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "evaluation*",
  "experiments*",
  "scripts*",
  "semantic_controller*",
  "services*",
  "src*",
  "viz*",
]

[tool.setuptools.package-data]
viz = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
