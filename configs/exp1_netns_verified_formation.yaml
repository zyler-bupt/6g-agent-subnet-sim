experiment:
  phase: main
  frozen: true
  pilot_source: results/wcnc_pilot/exp1_frozen_v2

simulation:
  repetitions: 30
  seeds: "0:29"
  task_sizes: [4, 8, 12, 16, 20]
  timeout_s: 45
  result_mode: real_linux_netns_veth_tc_data_plane

task:
  edge_ratio: 1.25
  num_gateways: 4
  required_throughput_mbps: 0.5

traffic_control:
  netem:
    base_delay_ms: [5.0, 20.0]
    jitter_ms: [1.0, 5.0]
    packet_loss_percent: [0.0, 1.0]
    queue_limit_packets: [100, 300]
  htb:
    bandwidth_mbps: [40.0, 100.0]
  background_traffic:
    enabled_probability: 0.30
    utilization_range: [0.10, 0.35]
    duration_s: 8
    protocol: udp
    port: 5099

verification:
  parallel: true
  max_attempts: 2
  retry_backoff_ms: 200
  ping:
    count: 3
    timeout_s: 1
    interval_s: 0.2
    max_packet_loss_percent: 0.0
    max_average_rtt_ms: 300.0
  iperf3:
    duration_s: 1
    omit_s: 0
    client_timeout_s: 6
    base_port: 5201
