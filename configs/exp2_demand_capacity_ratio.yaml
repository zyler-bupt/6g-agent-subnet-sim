experiment:
  phase: main
  frozen: true
  generator_version: wcnc-final-gamma-v1
  pilot_source: results/wcnc_pilot/exp2_gamma_v4

simulation:
  seeds: 100
  seed_range: "0:99"
  timeout_ms: 10000
  coordination_timeout_ms: 1000
  result_mode: in_memory_transactional_control_plane_gamma_simulation

task:
  num_agents: 10
  edge_ratio: 1.5
  num_gateways: 4
  cross_gateway_edge_ratio: 0.5

demand_capacity:
  ratios: [0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3]
  definition: "gamma = R_req / min(C_t, C_n, C_p)"
  controlled_variable: demand_to_capacity_ratio
  nuisance_distribution_policy: identical_across_gamma_for_each_seed

methods:
  - ours
  - alc
  - layer_wise_independent
  - no_global_verification
