experiment:
  phase: formal
  frozen: true
  protocol_id: wcnc_final_v3
  provenance: wcnc_final_v3_exp1_formal_protocol
  pilot_source: configs/exp1_netns_verified_formation_pilot_v3.yaml

methods: [proposed, cspf, global_sfc_embedding]

deployment:
  proposed:
    planning: exact_task_dag_scope
    routing: batched_bidirectional_task_edge_host_routes
    scheduling: parallel_single_batch
  cspf:
    planning: observed_bandwidth_and_delay_constrained_path
    routing: bidirectional_per_flow_host_routes
    scheduling: sequential_flow_batches
    tie_break: canonical_edge_id
  global_sfc_embedding:
    planning: deterministic_source_to_sink_edge_disjoint_chain_cover
    routing: per_chain_policy_table_host_routes
    scheduling: sequential_hop_route_then_activation_batches
    tie_break: canonical_edge_id

execution_gate:
  require_isolated_outer_network_namespace: true
  reject_manual_namespace_sentinel: true
  require_all_formal_trials_successful: true

simulation:
  repetitions: 50
  seeds: "0:49"
  task_sizes: [4, 8, 12, 16, 20]
  schedule:
    block_size: 5
    blocks: 10
    task_size_order: latin_rotation
  timeout_s: 45
  result_mode: real_linux_netns_veth_tc_data_plane

task:
  edge_ratio: 1.25
  num_gateways: 4
  required_throughput_mbps: 0.5

traffic_control:
  netem:
    base_delay_ms: [5.0, 20.0]
    jitter_ms: [1.0, 5.0]
    packet_loss_percent: [0.0, 1.0]
    queue_limit_packets: [100, 300]
  htb:
    bandwidth_mbps: [40.0, 100.0]
  background_traffic:
    enabled_probability: 0.30
    utilization_range: [0.10, 0.35]
    duration_s: 8
    readiness_timeout_s: 2
    minimum_payload_bytes: 65536
    protocol: udp
    port: 5099

verification:
  parallel: true
  max_attempts: 2
  retry_backoff_ms: 200
  ping:
    count: 3
    timeout_s: 1
    interval_s: 0.2
    packet_loss_record_only: true
    max_average_rtt_ms: 300.0
  iperf3:
    duration_s: 2
    omit_s: 0
    client_timeout_s: 6
    base_port: 5201

audit:
  path_bottleneck:
    relative_tolerance: 0.10
    short_tcp_min_tolerance_mbps: 0.25
