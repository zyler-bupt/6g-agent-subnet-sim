simulation:
  seeds: 100
  timeout_ms: 10000
  coordination_timeout_ms: 1000
  result_mode: in_memory_transactional_control_plane_stress_simulation

task:
  num_agents: 10
  edge_ratio: 1.5
  num_gateways: 4
  cross_gateway_edge_ratio: 0.5

stress:
  intensities: [0.6, 0.8, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5]
  proposals_per_layer: 3
  definition:
    normalized_stress: clamp((rho - 0.6) / 0.9, 0, 1)
    application_demand_coefficient: 0.30
    transport_demand_multiplier: 1.18
    network_capacity_decline_coefficient: 0.80
    network_utilization_coefficient: 0.50
    physical_capacity_decline_coefficient: 0.95
    maximum_latency_tightening_ms: 9.0

methods:
  - ours
  - alc
  - layer_wise_independent
  - no_global_verification
