simulation:
  seeds: 30
  timeout_ms: 10000
  result_mode: in_memory_transactional_control_plane_simulation

task:
  num_agents: 20
  edge_ratio: 1.5
  num_gateways: 4
  cross_gateway_edge_ratio: 0.5

topology:
  multi_hop: true
  candidate_paths: 2

monitor:
  probe_interval_ms: 50
  failure_detection_threshold: 3
  qos_violation_threshold: 3
  stable_health_windows: 3

controller:
  verification_enabled: true
  rollback_enabled: true
  scope_identification_enabled: true

fault_sweeps:
  agent_failure_levels:
    - application_same_gateway
    - application_different_gateway
    - transport
    - network
    - physical
  link_capacity_factors: [1.0, 0.8, 0.6, 0.4, 0.0]
  physical_capacity_factors: [1.0, 0.8, 0.6, 0.4, 0.2]

ablations:
  methods: [no_scope, no_verification_rollback]
  representative_points_per_fault: 1

netns_case_study:
  enabled: false
  mechanism_validation_only: true
  probe_interval_ms: 50
  stable_health_windows: 3
