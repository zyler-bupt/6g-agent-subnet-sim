name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[all,dev]'
      - name: Compile retained Python sources
        run: python -m compileall -q src semantic_controller services viz experiments scripts
      - name: Run non-privileged tests
        run: python -m unittest discover -v
      - name: Canonical pilot smoke
        run: python scripts/pilot_wcnc_final_v3.py --help

  netns-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate privileged testbed scripts
        run: bash -n testbed/preflight.sh testbed/setup_topology.sh testbed/teardown.sh scripts/run_wcnc_final_v3_remote.sh
      - name: Explain execution boundary
        run: echo "Full netns tests require a dedicated Linux runner with root/CAP_NET_ADMIN."
